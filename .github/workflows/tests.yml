name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-ci.txt
      - run: pytest -q
        env:
          # No database or broker keys in CI: DB-dependent checks skip themselves.
          DB_PATH: /nonexistent/market_radar.db
